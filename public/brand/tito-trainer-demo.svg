<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tito Trainer Demo">
  <defs>
    <linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2E63"/>
      <stop offset="1" stop-color="#1E1440"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B98BFF"/>
      <stop offset="1" stop-color="#7B1FA2"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgd)"/>
  <!-- dumbbell -->
  <g fill="#FFFFFF">
    <rect x="150" y="228" width="212" height="36" rx="18"/>
    <rect x="120" y="196" width="40" height="100" rx="16"/>
    <rect x="352" y="196" width="40" height="100" rx="16"/>
    <rect x="96" y="214" width="30" height="64" rx="14"/>
    <rect x="386" y="214" width="30" height="64" rx="14"/>
  </g>
  <!-- DEMO tag -->
  <g>
    <rect x="176" y="312" width="160" height="52" rx="26" fill="url(#ring)"/>
    <text x="256" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="4" fill="#FFFFFF">DEMO</text>
  </g>
</svg>

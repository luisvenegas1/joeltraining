<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrainSync — by Tito Apps</title>

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0B1F4B" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TrainSync" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

</head>

<body>
  <div id="root"></div>
  <script>
    // Captura el tipo de flujo Auth (invite/recovery) del hash ANTES de que
    // supabase-js procese y limpie la URL, para forzar "fijar contraseña".
    try { window.__authFlow = new URLSearchParams((location.hash || "").replace(/^#/, "")).get("type") || null; } catch (e) { window.__authFlow = null; }
  </script>
  <script type="module" src="/src/main.jsx"></script>


  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.log('SW error:', err));
      });
    }
  </script>

</body>

</html>
